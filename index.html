<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Whyld World MVP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  }


  /* Bottom UI bar */
  .ui {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 8px 12px;
    /* IMPORTANT: allow clicks */
    pointer-events: auto;
    z-index: 50;
  }

  .btn {
    background: rgba(255,255,255,0.9);
    border-radius: 999px;
    padding: 8px 14px;
    border: 1px solid #ddd;
    font-size: 14px;
    cursor: pointer;
  }

  /* Lens content card */
  .card {
    position: fixed;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    width: min(560px, 90%);
    background: rgba(255,255,255,0.98);
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 14px;
    display: none;
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    z-index: 60;
  }

  .card h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
  }

  .card p  {
    margin: 8px 0;
    font-size: 15px;
    line-height: 1.35;
  }

  .card .row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .link {
    color: #0b65c2;
    text-decoration: underline;
    cursor: pointer;
  }

  .close {
    margin-left: auto;
    background: #f4f4f4;
  }

 /* Full-screen aura overlay */
.lens-aura {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 40; /* Below UI and card */
  background: transparent; /* no full-screen wash */
  transition: box-shadow 0.3s ease, opacity 0.3s ease;
}

/* Each lens uses a bold edge frame + glow */
.lens-explore {
  box-shadow:
    0 0 0 2px rgba(80, 180, 255, 0.6) inset,   /* crisp inner border */
    0 0 40px 18px rgba(80, 180, 255, 0.4) inset;  /* soft outer glow */
}

.lens-serve {
  box-shadow:
    0 0 0 10px rgba(100, 220, 160, 0.95) inset,
    0 0 40px 18px rgba(100, 220, 160, 0.8) inset;
}

.lens-create {
  box-shadow:
    0 0 0 10px rgba(255, 180, 80, 0.95) inset,
    0 0 40px 18px rgba(255, 180, 80, 0.8) inset;
}

.lens-inspire {
  box-shadow:
    0 0 0 10px rgba(220, 120, 255, 0.95) inset,
    0 0 40px 18px rgba(220, 120, 255, 0.8) inset;
}

</style>
  
</head>
<body>
  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Marker (use printed HIRO marker) -->
    <a-marker preset="hiro">
      <!-- Text moved above and slightly toward the camera so it clears the printed marker -->
      <a-entity position="0 0.4 -0.6" rotation="-90 0 0">
        <a-text
          value="Point at the marker to reveal layers →"
          align="center"
          color="#222"
          width="3.2">
        </a-text>
      </a-entity>

      <!-- Slightly smaller presence ring so it hugs the marker -->
      <a-entity
        geometry="primitive: torus; radius: 0.25; tube: 0.02"
        material="color: #3a86ff; opacity: 0.85"
        position="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Lens Aura Overlay -->
  <div id="lens-aura" class="lens-aura lens-explore"></div>

  <!-- Lens content card -->
  <div id="card" class="card">
    <h3 id="card-title">Explore</h3>
    <p id="card-text">
      That old motorcycle by the window has crossed more miles than most of us will.
      Look closer at the worn grips and the patched saddle—each mark is a waypoint.
      What did this machine witness, and what did its rider learn along the way?
    </p>
    <div class="row">
      <a id="reflect-link" class="link" href="#" target="_blank">Leave a reflection</a>
      <button class="btn close" onclick="hideCard()">Close</button>
    </div>
  </div>

  <!-- Bottom UI: lens buttons -->
  <div class="ui">
    <button class="btn" onclick="showLens('Explore')">Explore</button>
    <button class="btn" onclick="showLens('Serve')">Serve</button>
    <button class="btn" onclick="showLens('Create')">Create</button>
    <button class="btn" onclick="showLens('Inspire')">Inspire</button>
    <button class="btn" onclick="showLens('Reflect')">Reflect</button>
  </div>

  <script>
    // TODO: replace with your real form URL
    const FORM_URL_BASE = "https://YOUR_FORM_LINK_HERE";

    const STORIES = {
      "Explore": "Replace with your Explore story (50–80 words).",
      "Serve":   "Replace with your Serve story (50–80 words).",
      "Create":  "Replace with your Create story (50–80 words).",
      "Inspire": "Replace with your Inspire story (50–80 words).",
      "Reflect": "Replace with your Reflect prompt or question."
    };

    function setLensAura(lensKey) {
      const aura = document.getElementById('lens-aura');
      aura.classList.remove(
        'lens-explore',
        'lens-serve',
        'lens-create',
        'lens-inspire',
        'lens-reflect'
      );
      aura.classList.add('lens-' + lensKey);
    }

    function showLens(lensLabel) {
      const lensKey = lensLabel.toLowerCase(); // "Explore" -> "explore"

      // 1) Update the aura color
      setLensAura(lensKey);

      // 2) Update the card title and text
      const titleEl = document.getElementById("card-title");
      const textEl  = document.getElementById("card-text");
      const linkEl  = document.getElementById("reflect-link");
      const cardEl  = document.getElementById("card");

      titleEl.innerText = lensLabel;
      textEl.innerText  = STORIES[lensLabel] || "";

      // 3) Update reflection link with ?lens= param
      const urlHasQuery = FORM_URL_BASE.includes("?");
      const link = urlHasQuery
        ? `${FORM_URL_BASE}&lens=${encodeURIComponent(lensLabel)}`
        : `${FORM_URL_BASE}?lens=${encodeURIComponent(lensLabel)}`;
      linkEl.href = link;

      // 4) Show the card
      cardEl.style.display = "block";
    }

    function hideCard() {
      document.getElementById("card").style.display = "none";
    }
  </script>
</body>
</html>
