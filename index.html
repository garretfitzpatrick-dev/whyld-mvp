<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Whyld World MVP</title>

  <!-- Fullscreen + immersive viewport -->
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <!-- Enable iOS fullscreen (standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Enable Android fullscreen -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Optional but recommended if you want home-screen mode -->
  <meta name="apple-mobile-web-app-title" content="Whyld World">
  <!-- <link rel="apple-touch-icon" href="icon.png"> -->

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- Base fullscreen / reset -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;     /* prevent iOS scroll bounce */
      background: black;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    /* Make AR scene fill the viewport */
    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Main UI styles -->
  <style>
    /* Bottom UI bar */
    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 8px 12px;
      pointer-events: auto;
      z-index: 50;
    }

    .btn {
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid #ddd;
      font-size: 14px;
      cursor: pointer;
    }

    /* Lens content card */
    .card {
      position: fixed;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      width: min(560px, 90%);
      background: rgba(255,255,255,0.98);
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      display: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
      z-index: 60;
    }

    .card h3 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    .card p  {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.35;
    }

    .card .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .link {
      color: #0b65c2;
      text-decoration: underline;
      cursor: pointer;
    }

    .close {
      margin-left: auto;
      background: #f4f4f4;
    }

    /* Full-screen aura overlay */
    .lens-aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40; /* Below UI and card */
      background: transparent; /* no full-screen wash */
      transition: box-shadow 0.3s ease, opacity 0.3s ease;
    }

    /* Each lens uses a bold edge frame + glow */
    .lens-explore {
      box-shadow:
        0 0 0 4px rgba(80, 180, 255, 0.7) inset,
        0 0 40px 18px rgba(80, 180, 255, 0.4) inset;
    }

    .lens-serve {
      box-shadow:
        0 0 0 4px rgba(100, 220, 160, 0.7) inset,
        0 0 40px 18px rgba(100, 220, 160, 0.4) inset;
    }

    .lens-create {
      box-shadow:
        0 0 0 4px rgba(255, 180, 80, 0.7) inset,
        0 0 40px 18px rgba(255, 180, 80, 0.4) inset;
    }

    .lens-inspire {
      box-shadow:
        0 0 0 4px rgba(220, 120, 255, 0.7) inset,
        0 0 40px 18px rgba(220, 120, 255, 0.4) inset;
    }

    .lens-reflect {
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.7) inset,
        0 0 40px 18px rgba(220, 120, 255, 0.4) inset;
    }
  </style>
</head>
<body>
  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Marker (use printed HIRO marker) -->
    <a-marker preset="hiro" id="ww-marker">
      <!-- Text moved above and slightly toward the camera so it clears the printed marker -->
      <a-entity position="0 0.4 -0.6" rotation="-90 0 0">
        <a-text
          value="Point at the marker to reveal layers →"
          align="center"
          color="#222"
          width="3.2">
        </a-text>
      </a-entity>

      <!-- Slightly smaller presence ring so it hugs the marker -->
      <a-entity
        geometry="primitive: torus; radius: 0.25; tube: 0.02"
        material="color: #3a86ff; opacity: 0.85"
        position="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Lens Aura Overlay -->
  <div id="lens-aura" class="lens-aura"></div>

  <!-- Lens content card (shown when marker visible) -->
  <div id="card" class="card">
    <h3 id="card-title">Explore</h3>
    <p id="card-text">
      That old motorcycle by the window has crossed more miles than most of us will.
      Look closer at the worn grips and the patched saddle—each mark is a waypoint.
      What did this machine witness, and what did its rider learn along the way?
    </p>
    <div class="row">
      <a id="reflect-link" class="link" href="#" target="_blank">Leave a reflection</a>
      <button class="btn close" onclick="hideCard()">Close</button>
    </div>
  </div>

  <!-- Bottom UI: lens buttons -->
  <div class="ui">
    <button class="btn" onclick="setLens('Explore')">Explore</button>
    <button class="btn" onclick="setLens('Serve')">Serve</button>
    <button class="btn" onclick="setLens('Create')">Create</button>
    <button class="btn" onclick="setLens('Inspire')">Inspire</button>
    <button class="btn" onclick="setLens('Reflect')">Reflect</button>
  </div>

  <script>
    // TODO: replace with your real form URL
    const FORM_URL_BASE = "https://YOUR_FORM_LINK_HERE";

    const STORIES = {
      "Explore": "Replace with your Explore story (50–80 words).",
      "Serve":   "Replace with your Serve story (50–80 words).",
      "Create":  "Replace with your Create story (50–80 words).",
      "Inspire": "Replace with your Inspire story (50–80 words).",
      "Reflect": "Replace with your Reflect prompt or question."
    };

    // The lens currently selected by the user
    let currentLensLabel = "Explore";

    function setLens(lensLabel) {
      currentLensLabel = lensLabel;

      // 1) Update aura immediately for visual feedback
      const lensKey = lensLabel.toLowerCase(); // "Explore" -> "explore"
      const aura = document.getElementById('lens-aura');
      aura.classList.remove(
        'lens-explore',
        'lens-serve',
        'lens-create',
        'lens-inspire',
        'lens-reflect'
      );
      aura.classList.add('lens-' + lensKey);

      // 2) If the card is currently visible, update its content right away
      const cardEl = document.getElementById("card");
      if (cardEl.style.display !== "none") {
        updateCardForCurrentLens(false); // don't force show; just update content
      }
    }

    function updateCardForCurrentLens(showIfHidden = true) {
      const titleEl = document.getElementById("card-title");
      const textEl  = document.getElementById("card-text");
      const linkEl  = document.getElementById("reflect-link");
      const cardEl  = document.getElementById("card");

      const story = STORIES[currentLensLabel] || "";

      titleEl.innerText = currentLensLabel;
      textEl.innerText  = story;

      // Update reflection link with ?lens= param
      const urlHasQuery = FORM_URL_BASE.includes("?");
      const link = urlHasQuery
        ? `${FORM_URL_BASE}&lens=${encodeURIComponent(currentLensLabel)}`
        : `${FORM_URL_BASE}?lens=${encodeURIComponent(currentLensLabel)}`;
      linkEl.href = link;

      if (showIfHidden) {
        cardEl.style.display = "block";
      }
    }

    function hideCard() {
      document.getElementById("card").style.display = "none";
    }

    // Hook card visibility to marker visibility
    window.addEventListener('DOMContentLoaded', () => {
      // Initialize aura to default lens
      setLens(currentLensLabel);

      const marker = document.querySelector('#ww-marker');
      if (marker) {
        marker.addEventListener('markerFound', () => {
          updateCardForCurrentLens(true);
        });
        marker.addEventListener('markerLost', () => {
          hideCard();
        });
      }
    });
  </script>
</body>
</html>
