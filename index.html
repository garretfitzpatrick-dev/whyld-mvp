<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Whyld World MVP</title>

  <!-- Fullscreen + immersive viewport -->
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <!-- Enable iOS fullscreen (standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Enable Android fullscreen -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Optional but recommended if you want home-screen mode -->
  <meta name="apple-mobile-web-app-title" content="Whyld World">

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- Base fullscreen / reset -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;     /* prevent iOS scroll bounce */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      
    }
  </style>

  <!-- Main UI styles -->
  <style>
    /* Bottom UI bar */
    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      flex-direction: column;   /* stack rows vertically */
      gap: 6px;
      padding: 8px 12px;
      pointer-events: auto;
      z-index: 50;
    }
    
    .ui-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: nowrap;        /* prevent individual rows from wrapping */
    }
    
    .ui-row.main .btn {
      padding: 8px 12px;
      font-size: 14px;
      white-space: nowrap;
    }
    
    .ui-row.dev .btn {
      padding: 4px 10px;
      font-size: 11px;
      opacity: 0.85;
    }

    .btn {
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid #ddd;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Base style for all lens buttons */
    .lens-btn {
      border-width: 2px;
      border-style: solid;
      background: rgba(255,255,255,0.95);
      transition: all 0.2s ease;
    }
    
    /* ====== Per-lens colors ======= */
    
    .lens-explore-btn {
      border-color: rgba(80,180,255,0.9);
      box-shadow: inset 0 0 6px rgba(80,180,255,0.25);
    }
    
    .lens-serve-btn {
      border-color: rgba(100,220,160,0.9);
      box-shadow: inset 0 0 6px rgba(100,220,160,0.25);
    }
    
    .lens-create-btn {
      border-color: rgba(255,180,80,0.9);
      box-shadow: inset 0 0 6px rgba(255,180,80,0.25);
    }
    
    .lens-inspire-btn {
      border-color: rgba(220,120,255,0.9);
      box-shadow: inset 0 0 6px rgba(220,120,255,0.25);
    }
    
    .lens-reflect-btn {
      border-color: rgba(255,255,255,0.9);
      box-shadow: inset 0 0 6px rgba(255,255,255,0.2);
    }

    .lens-explore-btn { 
      --lens-color: rgba(80,180,255,1); 
      border-color: var(--lens-color);
      color: #1877cc;
    }
    .lens-serve-btn {   
      --lens-color: rgba(100,220,160,1);
      border-color: var(--lens-color);
      color: #1c8f5a;
    }
    .lens-create-btn {  
      --lens-color: rgba(255,180,80,1);
      border-color: var(--lens-color);
      color: #d67a00;
    }
    .lens-inspire-btn { 
      --lens-color: rgba(220,120,255,1);
      border-color: var(--lens-color);
      color: #aa4ad9;
    }
    .lens-reflect-btn { 
      --lens-color: rgba(255,255,255,1);
      border-color: rgba(255,255,255,0.9);
      color: #555;
    }


    
    /* ====== Active lens button ====== */
    
    .lens-btn.active-lens {
      box-shadow:
        0 4px 10px rgba(0,0,0,0.18),
        0 0 12px var(--lens-color);
    }

    .lens-btn.active-lens {
      background: color-mix(in srgb, var(--lens-color) 12%, white);
    }

    
    .location-label {
      position: fixed;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 10px;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 11px;
      letter-spacing: 0.2px;
      border-radius: 8px;
      pointer-events: none;
      z-index: 65; /* above aura, below dev buttons */
    }
      
    /* Lens content card */
    .card {
      position: fixed;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      width: min(560px, 90%);
      background: rgba(255,255,255,0.98);
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      display: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
      z-index: 60;
    }

    .dev-ui {
      position: fixed;
      top: 14px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 70;
      pointer-events: auto;
    }
    
    .dev-ui .btn {
      font-size: 11px;
      padding: 4px 10px;
      opacity: 0.85;
    }

    .card h3 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    .card p  {
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.35;
    }

    #card-text.collapsed {
      max-height: 4.5em;  /* about 3 lines */
      overflow: hidden;
    }
    
    .card .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .link {
      color: #0b65c2;
      text-decoration: underline;
      cursor: pointer;
    }

    .close {
      margin-left: auto;
      background: #f4f4f4;
    }

    .card.layer-world {
      background: rgba(255,255,255,0.98);
    }
    
    .card.layer-community {
      background: #fff9f0;
    }
    
    .card.layer-personal {
      background: #f3f7ff;
    }

    /* Community layer: slightly taller card */
    .card.community-expanded {
      max-height: 70vh;
      overflow-y: auto;
    }
      
    /* Layer toggle (World / Community / Personal) */
    .layer-toggle {
      position: fixed;
      top: 4px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 65;
      pointer-events: auto;
    }

    .layer-btn {
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      opacity: 0.7;
    }

    .layer-btn.active {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-color: #ddd;
      opacity: 1;
    }

    .card.layer-world {
      border-color: rgba(0, 150, 255, 0.6);
    }
    .card.layer-community {
      border-color: rgba(120, 200, 120, 0.8);
    }
    .card.layer-personal {
      border-color: rgba(255, 160, 80, 0.9);
    }
    
    /* Full-screen aura overlay */
    .lens-aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40; /* Below UI and card, above AR scene */
      background: transparent;
      transition: box-shadow 0.25s ease, opacity 0.25s ease;
    }
    
    .lens-aura.zone-flash {
      animation: lensZoneFlash 0.35s ease-out;
    }

@keyframes lensZoneFlash {
  0% {
    opacity: 0.0;
  }
  30% {
    opacity: 1.0;
  }
  100% {
    opacity: 1.0;
  }
}
   
/* Zone entered animation: subtle pop + glow */
.card.zone-entered {
  animation: zoneEnteredCard 0.28s ease-out;
}

@keyframes zoneEnteredCard {
  0% {
    transform: translateX(-50%) translateY(-4px) scale(0.96);
    box-shadow: 0 0 0 rgba(0,0,0,0);
    opacity: 0.0;
  }
  60% {
    transform: translateX(-50%) translateY(0) scale(1.02);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    opacity: 1.0;
  }
  100% {
    transform: translateX(-50%) translateY(0) scale(1.0);
    box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    opacity: 1.0;
  }
}
    
/* Each lens: crisp border + soft inner glow */
.lens-explore {
  box-shadow:
    0 0 0 5px rgba(80, 180, 255, 0.9) inset,   /* strong border */
    0 0 30px 16px rgba(80, 180, 255, 0.35) inset; /* gentle glow */
}

.lens-serve {
  box-shadow:
    0 0 0 5px rgba(100, 220, 160, 0.9) inset,
    0 0 30px 16px rgba(100, 220, 160, 0.35) inset;
}

.lens-create {
  box-shadow:
    0 0 0 5px rgba(255, 180, 80, 0.9) inset,
    0 0 30px 16px rgba(255, 180, 80, 0.35) inset;
}

.lens-inspire {
  box-shadow:
    0 0 0 5px rgba(220, 120, 255, 0.9) inset,
    0 0 30px 16px rgba(220, 120, 255, 0.35) inset;
}

.lens-reflect {
  box-shadow:
    0 0 0 5px rgba(255, 255, 255, 0.9) inset,
    0 0 30px 16px rgba(255, 255, 255, 0.35) inset;
}

.reflections {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #eee;
  font-size: 13px;
  max-height: 90px;
  overflow-y: auto;
}

.reflections-title {
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
}

#reflections-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.reflection-item {
  margin: 2px 0;
}

/* Map toggle button near top-left */
.map-toggle-btn {
  position: fixed;
  top: 4px;
  left: 12px;
  z-index: 66;
  padding: 4px 10px;
  font-size: 11px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.6);
  background: rgba(0,0,0,0.45);
  color: #fff;
  cursor: pointer;
}

/* Zone map overlay */
.zone-map-overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: auto;
}

.zone-map-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
}

.zone-map-panel {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 90%);
  max-height: 70vh;
  background: rgba(255,255,255,0.97);
  border-radius: 16px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.zone-map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
  font-weight: 600;
}

.zone-map-close-btn {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px 4px;
}

.zone-map-body {
  padding: 8px 10px 10px;
  overflow-y: auto;
  font-size: 13px;
}

/* Individual zone row */
.zone-map-item {
  padding: 8px 10px;
  border-radius: 10px;
  margin-bottom: 6px;
  border: 1px solid #eee;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.zone-map-item:hover {
  background: #f7f9ff;
}

.zone-map-item-name {
  font-weight: 500;
}

.zone-map-item-meta {
  font-size: 11px;
  color: #666;
}

/* Highlight currently active zone */
.zone-map-item.active-zone {
  border-color: #3a86ff;
  box-shadow: 0 0 0 1px rgba(58,134,255,0.5);
  background: #eef4ff;
}



    
  </style>
  
</head>
<body>
  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Marker (use printed HIRO marker) -->
    <a-marker preset="hiro" id="ww-marker" emitevents="true">
      <!-- Text moved above and slightly toward the camera so it clears the printed marker -->
      <a-entity position="0 0.4 -0.6" rotation="-90 0 0">
        <a-text
          value="Point at the marker to reveal layers →"
          align="center"
          color="#222"
          width="3.2">
        </a-text>
      </a-entity>

      <!-- Slightly smaller presence ring so it hugs the marker -->
      <a-entity
        geometry="primitive: torus; radius: 0.25; tube: 0.02"
        material="color: #3a86ff; opacity: 0.85"
        position="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Lens Aura Overlay -->
  <div id="lens-aura" class="lens-aura"></div>

  <!-- Layer toggle: World / Community / Personal -->
  <div class="layer-toggle">
    <button class="layer-btn active" id="layer-world-btn" onclick="setLayer('World')">World</button>
    <button class="layer-btn" id="layer-community-btn" onclick="setLayer('Community')">Community</button>
    <button class="layer-btn" id="layer-personal-btn" onclick="setLayer('Personal')">Personal</button>
  </div>
  
  <!-- Lens content card (marker or zone controlled) -->
  <div id="card" class="card">
    <h3 id="card-title">Explore</h3>
    <p id="card-text" class="collapsed">
    That old motorcycle by the window has crossed more miles than most of us will.
    ...
    </p>
    <button id="story-toggle" class="link" type="button" onclick="toggleStoryExpand()">
      More
    </button>
    
    <div id="reflections" class="reflections" style="display:none;">
      <span class="reflections-title">Reflections here</span>
      <ul id="reflections-list"></ul>
    </div>
    
    <div class="row">
      <a id="reflect-link" class="link" href="#" target="_blank">Leave a reflection</a>
      <button class="btn close" onclick="hideCard()">Close</button>
    </div>

  </div>

<div id="location-label" class="location-label"></div>

  <!-- Map toggle button -->
<button class="map-toggle-btn" type="button" onclick="openZoneMap()">
  Map
</button>
  
  <!-- Bottom UI: lens buttons -->
 <div class="ui">
  <div class="ui-row main">
    <button class="btn lens-btn lens-explore-btn" onclick="setLens('Explore')">Explore</button>
    <button class="btn lens-btn lens-serve-btn" onclick="setLens('Serve')">Serve</button>
    <button class="btn lens-btn lens-create-btn" onclick="setLens('Create')">Create</button>
    <button class="btn lens-btn lens-inspire-btn" onclick="setLens('Inspire')">Inspire</button>
    <button class="btn lens-btn lens-reflect-btn" onclick="setLens('Reflect')">Reflect</button>
  </div>

  <div class="ui-row dev">
    <button class="btn dev-btn" onclick="debugSetLocation('hiro_marker', 'marker')">
      Dev: Marker
    </button>
    <button class="btn dev-btn" onclick="debugSetLocation('harvard_square_demo', 'zone')">
      Dev: Harvard Sq
    </button>
  </div>
</div>

<!-- Zone Map Overlay -->
<div id="zone-map-overlay" class="zone-map-overlay" style="display:none;">
  <div class="zone-map-backdrop" onclick="closeZoneMap()"></div>
  <div class="zone-map-panel">
    <div class="zone-map-header">
      <span>Harvard Square Zones</span>
      <button type="button" class="zone-map-close-btn" onclick="closeZoneMap()">✕</button>
    </div>
    <div class="zone-map-body" id="zone-map-body">
      <!-- Zone list will be filled by JS -->
    </div>
  </div>
</div>

  

<script>
  // =============================
  // CONFIG: reflection form link
  // (replace with your actual Airtable form URL)
  // =============================
  var FORM_URL_BASE = "https://airtable.com/appXPj1T4lTXjx1kD/shrNSUnk4yNRibuOx";

  // =============================
  // CONFIG: default stories by lens (fallback)
  // Used if no place-specific content found
  // =============================
  var STORIES = {
    "Explore": "Replace with your Explore story (50–80 words).",
    "Serve":   "Replace with your Serve story (50–80 words).",
    "Create":  "Replace with your Create story (50–80 words).",
    "Inspire": "Replace with your Inspire story (50–80 words).",
    "Reflect": "Replace with your Reflect prompt or question."
  };

  // =============================
  // CONTENT from Airtable via Cloudflare Worker
  // This will be filled dynamically.
  // =============================
  var CONTENT = {};
  var CONTENT_LOADED = false;
  var CONTENT_API_URL = "https://whyld-world-worker.garret-fitzpatrick.workers.dev/api/content";
  var REFLECTIONS_API_URL = "https://whyld-world-worker.garret-fitzpatrick.workers.dev/api/reflections";
  var reflectionsCache = {}; // key: locationId|lens -> array of reflections
  
  // =============================
  // STATE
  // =============================
  
  var storyExpanded = false;
  var currentLensLabel = "Explore";   // current lens
  var currentLayer = "World";  
  var currentLocation   = null;        // { type: 'marker' | 'zone', id: string }
  var markerVisible    = false;
  var activeZoneId     = null;
  var userLat = null;
  var userLon = null;
  var devMode = false;

  // =============================
  // LOAD CONTENT FROM API
  // =============================
  function loadContentFromAPI() {
    if (!CONTENT_API_URL) return;

    fetch(CONTENT_API_URL)
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Content API error: " + response.status);
        }
        return response.json();
      })
      .then(function (data) {
        CONTENT = data || {};
        CONTENT_LOADED = true;
        console.log("Whyld World content loaded from API:", CONTENT);
      })
      .catch(function (err) {
        console.warn("Failed to load content from API:", err);
        // CONTENT stays as {}, so STORIES will be used as fallback
      });
  }

  // =============================
  // LENS / AURA
  // =============================
  function setLens(lensLabel) {
    currentLensLabel = lensLabel;

    // Update aura
    var lensKey = lensLabel.toLowerCase();
    var aura = document.getElementById('lens-aura');
    aura.classList.remove(
      'lens-explore',
      'lens-serve',
      'lens-create',
      'lens-inspire',
      'lens-reflect'
    );
    aura.classList.add('lens-' + lensKey);

    // Highlight active bottom button
      document.querySelectorAll('.lens-btn').forEach(btn => {
        btn.classList.remove('active-lens');
      });
      document.querySelector('.lens-' + lensKey + '-btn').classList.add('active-lens');
    
    // If the card is currently visible and we have a location, update content
    var cardEl = document.getElementById("card");
    if (cardEl.style.display !== "none" && currentLocation) {
      updateCardForCurrentLens(false); // don't force show; just update content
    }
  }

  // =============================
  // LAYER TOGGLE (World / Community / Personal)
  // =============================
  function setLayer(layerLabel) {
    currentLayer = layerLabel;

    // Update button styles
    var worldBtn = document.getElementById("layer-world-btn");
    var commBtn  = document.getElementById("layer-community-btn");
    var persBtn  = document.getElementById("layer-personal-btn");

    if (worldBtn && commBtn && persBtn) {
      worldBtn.classList.toggle("active", layerLabel === "World");
      commBtn.classList.toggle("active", layerLabel === "Community");
      persBtn.classList.toggle("active", layerLabel === "Personal");
    }

    // When layer changes, refresh the card content and reflections (if visible)
    var cardEl = document.getElementById("card");
    if (cardEl && cardEl.style.display !== "none" && currentLocation) {
      updateCardForCurrentLens(false); // no need to force show
    }
  }
  
  // =============================
  // CARD CONTENT
  // =============================
    function updateCardForCurrentLens(showIfHidden) {
      if (typeof showIfHidden === "undefined") showIfHidden = true;
    
      var titleEl       = document.getElementById("card-title");
      var textEl        = document.getElementById("card-text");
      var toggleEl      = document.getElementById("story-toggle");
      var linkEl        = document.getElementById("reflect-link");
      var cardEl        = document.getElementById("card");
      var reflectionsEl = document.getElementById("reflections");
    
      if (!cardEl || !titleEl || !textEl || !linkEl) return;
    
      if (!currentLocation) {
        if (showIfHidden) cardEl.style.display = "none";
        return;
      }
    
      var ctxId = currentLocation.id;
      var placeContent = CONTENT[ctxId];
      var story = "";
    
      if (placeContent) {
        // New layered format: CONTENT[locationId][layer][lens]
        if (placeContent[currentLayer] && placeContent[currentLayer][currentLensLabel]) {
          story = placeContent[currentLayer][currentLensLabel];
        }
        // Fallback flat: CONTENT[locationId][lens]
        else if (placeContent[currentLensLabel]) {
          story = placeContent[currentLensLabel];
        }
      }
      if (!story) {
        story = STORIES[currentLensLabel] || "";
      }
    
      // Title shows lens only
      titleEl.innerText = currentLensLabel;
    
      // Reset card classes
      cardEl.classList.remove(
        "layer-world",
        "layer-community",
        "layer-personal",
        "community-expanded"
      );
    
      //
      // 🌍 WORLD LAYER — canonical story, collapsed with "More"
      //
      if (currentLayer === "World") {
        cardEl.classList.add("layer-world");
        textEl.innerText = story;
        textEl.classList.add("collapsed");
        if (toggleEl) {
          toggleEl.style.display = "inline-block";
          toggleEl.innerText = "More";
        }
        storyExpanded = false;
        if (reflectionsEl) reflectionsEl.style.display = "block";
    
        // 🔹 Link label for World
        linkEl.innerText = "Leave a reflection";
      }
    
      //
      // 👥 COMMUNITY LAYER — reflections first, taller card
      //
      else if (currentLayer === "Community") {
        cardEl.classList.add("layer-community", "community-expanded");
        textEl.innerText = story;
        textEl.classList.remove("collapsed");
        if (toggleEl) toggleEl.style.display = "none";
        if (reflectionsEl) reflectionsEl.style.display = "block";
    
        // 🔹 Link label for Community
        linkEl.innerText = "Leave a reflection";
      }
    
      //
      // 🙋 PERSONAL LAYER — introspection, no reflections shown
      //
      else if (currentLayer === "Personal") {
        cardEl.classList.add("layer-personal");
        textEl.innerText = story;     // ideally a prompt
        textEl.classList.remove("collapsed");
        if (toggleEl) toggleEl.style.display = "none";
        if (reflectionsEl) reflectionsEl.style.display = "none";  // hide reflections entirely
    
        // 🔹 Link label for Personal
        linkEl.innerText = "Capture a personal note";
      }
    
      // Build Airtable reflection link with prefilled fields
      var params = [];
      params.push("prefill_Lens=" + encodeURIComponent(currentLensLabel));
      // We decided: no Layer field in Airtable, so no prefill_Layer
      if (currentLocation && currentLocation.id) {
        params.push("prefill_LocationId=" + encodeURIComponent(currentLocation.id));
      }
    
      var urlHasQuery = FORM_URL_BASE.indexOf("?") !== -1;
      var link = urlHasQuery
        ? FORM_URL_BASE + "&" + params.join("&")
        : FORM_URL_BASE + "?" + params.join("&");
      linkEl.href = link;
    
      if (showIfHidden) {
        cardEl.style.display = "block";
      }
    
      // Load reflections for World + Community; skip Personal
      if (currentLayer !== "Personal") {
        loadReflectionsForCurrentLocationAndLens();
      }
    }

  function hideCard() {
    var cardEl = document.getElementById("card");
    if (cardEl) cardEl.style.display = "none";
  }

  function debugSetLocation(locationId, type) {
    devMode = true; // prevent geolocation from overriding 
    // type: 'marker' or 'zone'
    currentLocation = { type: type, id: locationId };
  
    if (type === 'marker') {
      markerVisible = true;
      activeZoneId = null;
    } else if (type === 'zone') {
      markerVisible = false;
      activeZoneId = locationId;
    }
  
    updateCardForCurrentLens(true);
    updateLocationLabelFromCurrentLocation();
  }

function updateLocationLabelFromCurrentLocation() {
  var el = document.getElementById("location-label");
  if (!el) return;

  if (!currentLocation) {
    el.innerText = "";
    return;
  }

  var baseLabel = "";
  
  if (currentLocation.type === "marker") {
    // You can change this label text later if you add more markers
    baseLabel = "Marker: hiro_marker";
  } else if (currentLocation.type === "zone") {
    var zoneId = currentLocation.id;
    var label = zoneId;
    if (Array.isArray(ZONES)) {
      var z = ZONES.find(function (zone) { return zone.id === zoneId; });
      if (z && z.label) {label = z.label;
    }
    }
    baseLabel = label;
  }
  el.innerText = baseLabel;
}
  
  // =============================
  // GEOLOCATION / ZONES
  // =============================
    var ZONES = [
  {
    id: "harvard_square_demo",     // keep or replace this one if you like
    label: "Harvard Square",
    lat: 42.3733,
    lon: -71.1190,
    radiusM: 50
  },
  {
    id: "hsq_kiosk",
    label: "Harvard Square Kiosk",
    lat: 42.37352,
    lon: -71.11919,
    radiusM: 35
  },
  {
    id: "harvard_coop_corner",
    label: "Harvard Coop Corner",
    lat: 42.37365,
    lon: -71.11936,
    radiusM: 40
  },
  {
    id: "st_pauls_steps",
    label: "St. Paul's Steps",
    lat: 42.3712,
    lon: -71.1156,
    radiusM: 35
  }
];

  function startGeoWatch() {
    if (!navigator.geolocation) {
      console.warn("Geolocation not available in this browser.");
      return;
    }

    navigator.geolocation.watchPosition(
      function (pos) {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        checkNearbyZones();
      },
      function (err) {
        console.warn("Geolocation error:", err);
      },
      {
        enableHighAccuracy: true,
        maximumAge: 10000,
        timeout: 20000
      }
    );
  }

  function checkNearbyZones() {
    if (devMode) return; // 🔥 do nothing in dev mode
    
    var nearestZone = null;
    for (var i = 0; i < ZONES.length; i++) {
      var zone = ZONES[i];
      if (isInsideZone(userLat, userLon, zone)) {
        nearestZone = zone;
        break;
      }
    }

  if (nearestZone) {
    if (activeZoneId !== nearestZone.id) {
      activeZoneId = nearestZone.id;

      if (!markerVisible) {
        currentLocation = { type: 'zone', id: activeZoneId };
        updateCardForCurrentLens(true);
        triggerZoneEnteredAnimation();
        updateLocationLabelFromCurrentLocation();   // 🔹 label updates here
      }
    }
    
    } else {
      // Left all zones
      activeZoneId = null;
      if (!markerVisible) {
        currentLocation = null;
        hideCard();
        updateLocationLabelFromCurrentLocation();
      }
    }
  }

  function isInsideZone(userLat, userLon, zone) {
    if (userLat == null || userLon == null) return false;

    var R = 6371e3; // Earth radius in meters
    var dLat = (zone.lat - userLat) * Math.PI / 180;
    var dLon = (zone.lon - userLon) * Math.PI / 180;

    var a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(userLat * Math.PI / 180) * Math.cos(zone.lat * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);

    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    var distance = R * c;

    return distance <= zone.radiusM;
  }

  function toggleStoryExpand() {
  var textEl = document.getElementById("card-text");
  var btnEl  = document.getElementById("story-toggle");

  if (!textEl || !btnEl) return;
    
  storyExpanded = !storyExpanded;

  if (storyExpanded) {
    textEl.classList.remove("collapsed");
    btnEl.innerText = "Less";
  } else {
    textEl.classList.add("collapsed");
    btnEl.innerText = "More";
  }
}

  // Convert timestamp into "time ago" string
  function formatTimeAgo(timestamp) {
    if (!timestamp) return "";
  
    var past = new Date(timestamp);
    var now = new Date();
    var diffMs = now - past;
    var sec = Math.floor(diffMs / 1000);
    var min = Math.floor(sec / 60);
    var hr  = Math.floor(min / 60);
    var day = Math.floor(hr / 24);
  
    if (sec < 60) return "just now";
    if (min < 60) return min + " min ago";
    if (hr < 24) return hr + " hr ago";
    if (day === 1) return "yesterday";
    if (day < 7) return day + " days ago";
  
    // Otherwise show date like "Nov 18"
    return past.toLocaleDateString(undefined, {
      month: "short",
      day: "numeric"
    });
  }

// =============================
// REFLECTIONS
// =============================
  function loadReflectionsForCurrentLocationAndLens() {
  if (!currentLocation || !REFLECTIONS_API_URL) {
    renderReflections([]);
    return;
  }

  var locationId = currentLocation.id;
  var lens = currentLensLabel;
  var layer = currentLayer;
  var key = locationId + "|" + lens + "|" + layer;

  // Use cache if we already loaded these
  if (reflectionsCache[key]) {
    renderReflections(reflectionsCache[key]);
    return;
  }

  var url = REFLECTIONS_API_URL +
    "?locationId=" + encodeURIComponent(locationId) +
    "&lens=" + encodeURIComponent(lens) +
    "&layer=" + encodeURIComponent(layer);

  fetch(url)
    .then(function (resp) {
      if (!resp.ok) throw new Error("Reflections API error: " + resp.status);
      return resp.json();
    })
    .then(function (data) {
      var refs = (data && data.reflections) || [];
      reflectionsCache[key] = refs;
      renderReflections(refs);
    })
    .catch(function (err) {
      console.warn("Failed to load reflections:", err);
      renderReflections([]);
    });
}

  function renderReflections(refs) {
    var container = document.getElementById("reflections");
    var listEl = document.getElementById("reflections-list");
    if (!container || !listEl) return;
  
    if (currentLayer === "Personal") {
      container.style.display = "none";
      listEl.innerHTML = "";
      return;
    }
  
    if (!refs || refs.length === 0) {
      container.style.display = "none";
      listEl.innerHTML = "";
      return;
    }
  
    container.style.display = "block";
    var html = "";
  
    if (currentLayer === "World") {
      // Small preview (up to 3), same aesthetic as Community
      var max = Math.min(refs.length, 3);
      for (var i = 0; i < max; i++) {
        var r = refs[i];
        var txt = escapeHtml(r.text || "");
        
        // Truncate in World layer so it feels like a preview
        if (txt.length > 140) {
          txt = txt.slice(0, 137) + "…";
        }
    
        var who = r.userName
          ? '<strong>' + escapeHtml(r.userName) + '</strong>'
          : '';
        var time = r.timestamp ? " · " + formatTimeAgo(r.timestamp) : "";
    
        var prefix = who ? who + time + ": " : "";
    
        html += '<li class="reflection-item">' + prefix + txt + '</li>';
      }
    }

  
    else if (currentLayer === "Community") {
      var maxC = Math.min(refs.length, 20);
      for (var j = 0; j < maxC; j++) {
        var r = refs[j];
        var txt = escapeHtml(r.text || "");
        var who = r.userName
          ? '<strong>' + escapeHtml(r.userName) + '</strong>'
          : '';
        var time = r.timestamp ? " · " + formatTimeAgo(r.timestamp) : "";
    
        // if no name, no bullet separator
        var prefix = who ? who + time + ": " : "";
    
        html += '<li class="reflection-item">' + prefix + txt + '</li>';
      }
    }

    listEl.innerHTML = html;
  }
  
  
  // Simple HTML escaping to avoid issues
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  
// =============================
// ANIMATIONS
// =============================
  function triggerZoneEnteredAnimation() {
  var cardEl = document.getElementById("card");
  var auraEl = document.getElementById("lens-aura");
  if (!cardEl) return;

  // Restart the card animation
  cardEl.classList.remove("zone-entered");
  // Force reflow so animation can replay
  void cardEl.offsetWidth;
  cardEl.classList.add("zone-entered");

  // Optional: small aura flash
  if (auraEl) {
    auraEl.classList.remove("zone-flash");
    void auraEl.offsetWidth;
    auraEl.classList.add("zone-flash");
  }
}

// =============================
// ZONE MAP OVERLAY
// =============================
  function openZoneMap() {
    var overlay = document.getElementById("zone-map-overlay");
    if (!overlay) return;
    overlay.style.display = "block";
    renderZoneMapList();
  }
  
  function closeZoneMap() {
    var overlay = document.getElementById("zone-map-overlay");
    if (!overlay) return;
    overlay.style.display = "none";
  }
  
  // Build zone list in the overlay
  function renderZoneMapList() {
    var bodyEl = document.getElementById("zone-map-body");
    if (!bodyEl || !Array.isArray(ZONES)) return;
  
    var html = "";
    for (var i = 0; i < ZONES.length; i++) {
      var z = ZONES[i];
      var name = z.label || z.id;
      var id = z.id;
  
      var isActive = (currentLocation && currentLocation.type === "zone" && currentLocation.id === id)
                     || activeZoneId === id;
  
      var classes = "zone-map-item";
      if (isActive) classes += " active-zone";
  
      var meta = "";
      if (activeZoneId === id) {
        meta = "You are here (via GPS)";
      } else if (currentLocation && currentLocation.type === "zone" && currentLocation.id === id) {
        meta = "Viewing this zone";
      } else {
        meta = "Tap to preview";
      }
  
      html +=
        '<div class="' + classes + '" onclick="selectZoneFromMap(\'' + id + '\')">' +
          '<div class="zone-map-item-name">' + escapeHtml(name) + '</div>' +
          '<div class="zone-map-item-meta">' + escapeHtml(meta) + '</div>' +
        '</div>';
    }
  
    bodyEl.innerHTML = html;
  }
  
  // When user taps a zone in the map overlay
  function selectZoneFromMap(zoneId) {
    // Enter dev mode so GPS won't fight us
    devMode = true;
  
    // Reuse existing helper
    debugSetLocation(zoneId, 'zone');
  
    // Close map after selection
    closeZoneMap();
  }


  
  // =============================
  // INIT: marker + geolocation + content load
  // =============================
  window.addEventListener('DOMContentLoaded', function () {
    // Initialize aura to default lens
    setLens(currentLensLabel);
    setLayer(currentLayer);

    // Load content from Cloudflare Worker / Airtable
    loadContentFromAPI();

    // Marker-based triggers
    var marker = document.querySelector('#ww-marker');
    if (marker) {
      marker.addEventListener('markerFound', function () {
        markerVisible = true;
        currentLocation = { type: 'marker', id: 'hiro_marker' };
        updateCardForCurrentLens(true);
        updateLocationLabelFromCurrentLocation();
      });

      marker.addEventListener('markerLost', function () {
        markerVisible = false;

        if (activeZoneId) {
          // Fall back to zone if we are inside one
          currentLocation = { type: 'zone', id: activeZoneId };
          updateCardForCurrentLens(true);
          triggerZoneEnteredAnimation();   // <- new line
        } else {
          currentLocation = null;
          hideCard();
        }
        updateLocationLabelFromCurrentLocation();
      });
    }

    // Start GPS watching for zones
    startGeoWatch();
  });
</script>
