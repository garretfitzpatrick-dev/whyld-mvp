<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Whyld World MVP</title>

  <!-- Fullscreen + immersive viewport -->
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <!-- Enable iOS fullscreen (standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Enable Android fullscreen -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Optional but recommended if you want home-screen mode -->
  <meta name="apple-mobile-web-app-title" content="Whyld World">

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <!-- Base fullscreen / reset -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;     /* prevent iOS scroll bounce */
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      
    }
  </style>

  <!-- Main UI styles -->
  <style>
    /* Bottom UI bar */
    .ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 8px 12px;
      pointer-events: auto;
      z-index: 50;
    }

    .btn {
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 8px 14px;
      border: 1px solid #ddd;
      font-size: 14px;
      cursor: pointer;
    }

    /* Lens content card */
    .card {
      position: fixed;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      width: min(560px, 90%);
      background: rgba(255,255,255,0.98);
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      display: none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
      z-index: 60;
    }

    .card h3 {
      margin: 0 0 6px 0;
      font-size: 18px;
    }

    .card p  {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.35;
    }

    .card .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .link {
      color: #0b65c2;
      text-decoration: underline;
      cursor: pointer;
    }

    .close {
      margin-left: auto;
      background: #f4f4f4;
    }

    /* Full-screen aura overlay */
    .lens-aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40; /* Below UI and card */
      background: transparent; /* no full-screen wash */
      transition: box-shadow 0.3s ease, opacity 0.3s ease;
    }

    /* Each lens uses a bold edge frame + glow */
    .lens-explore {
      box-shadow:
        0 0 0 3px rgba(80, 180, 255, 0.7) inset;
    }

    .lens-serve {
      box-shadow:
        0 0 0 3px rgba(100, 220, 160, 0.7) inset;
    }

    .lens-create {
      box-shadow:
        0 0 0 3px rgba(255, 180, 80, 0.7) inset;
    }

    .lens-inspire {
      box-shadow:
        0 0 0 3px rgba(220, 120, 255, 0.7) inset;
    }

    .lens-reflect {
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.7) inset;
    }
  </style>

<style>
  a-scene {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw !important;
    height: 100vh !important;
    margin: 0 !important;
    padding: 0 !important;
    z-index: 1 !important;
  }

  .a-canvas, .a-video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }
</style>


  
</head>
<body>
  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Marker (use printed HIRO marker) -->
    <a-marker preset="hiro" id="ww-marker">
      <!-- Text moved above and slightly toward the camera so it clears the printed marker -->
      <a-entity position="0 0.4 -0.6" rotation="-90 0 0">
        <a-text
          value="Point at the marker to reveal layers →"
          align="center"
          color="#222"
          width="3.2">
        </a-text>
      </a-entity>

      <!-- Slightly smaller presence ring so it hugs the marker -->
      <a-entity
        geometry="primitive: torus; radius: 0.25; tube: 0.02"
        material="color: #3a86ff; opacity: 0.85"
        position="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Lens Aura Overlay -->
  <div id="lens-aura" class="lens-aura"></div>

  <!-- Lens content card (marker or zone controlled) -->
  <div id="card" class="card">
    <h3 id="card-title">Explore</h3>
    <p id="card-text">
      That old motorcycle by the window has crossed more miles than most of us will.
      Look closer at the worn grips and the patched saddle—each mark is a waypoint.
      What did this machine witness, and what did its rider learn along the way?
    </p>
    <div class="row">
      <a id="reflect-link" class="link" href="#" target="_blank">Leave a reflection</a>
      <button class="btn close" onclick="hideCard()">Close</button>
    </div>
  </div>

  <!-- Bottom UI: lens buttons -->
  <div class="ui">
    <button class="btn" onclick="setLens('Explore')">Explore</button>
    <button class="btn" onclick="setLens('Serve')">Serve</button>
    <button class="btn" onclick="setLens('Create')">Create</button>
    <button class="btn" onclick="setLens('Inspire')">Inspire</button>
    <button class="btn" onclick="setLens('Reflect')">Reflect</button>
  </div>

  <script>
    // =============================
    // CONFIG: reflection form link
    // =============================
    var FORM_URL_BASE = "https://YOUR_FORM_LINK_HERE";

    // =============================
    // CONFIG: default stories by lens (fallback)
    // =============================
    var STORIES = {
      "Explore": "Replace with your Explore story (50–80 words).",
      "Serve":   "Replace with your Serve story (50–80 words).",
      "Create":  "Replace with your Create story (50–80 words).",
      "Inspire": "Replace with your Inspire story (50–80 words).",
      "Reflect": "Replace with your Reflect prompt or question."
    };

    // =============================
    // CONFIG: place-specific content
    // =============================
    var CONTENT = {
      // Marker-specific content for the HIRO marker
      "hiro_marker": {
        "Explore": "Marker / Explore: a portable portal, carried from desk to street. This space is your testbed for layering meaning onto the world.",
        "Serve":   "Marker / Serve: imagine this marker as a tiny beacon for causes you care about.",
        "Create":  "Marker / Create: this printed square is the simplest possible canvas. What could you build from here?",
        "Inspire": "Marker / Inspire: every prototype starts with something this small.",
        "Reflect": "Marker / Reflect: what are you really trying to learn from this experiment?"
      },

      // Example GPS zone (Harvard Square demo)
      "harvard_square_demo": {
        "Explore": "Harvard Square / Explore: this area has carried ideas, protests, and discoveries across generations.",
        "Serve":   "Harvard Square / Serve: within a short walk, multiple organizations support housing, food, and education.",
        "Create":  "Harvard Square / Create: street performance, bookstores, and art spaces all converge here.",
        "Inspire": "Harvard Square / Inspire: many people started new chapters of their lives on these streets.",
        "Reflect": "Harvard Square / Reflect: when you think of 'this place,' what comes to mind first?"
      }
    };

    // =============================
    // CONFIG: GPS zones
    // =============================
    var ZONES = [
      {
        id: "harvard_square_demo",
        lat: 42.3733,      // placeholder
        lon: -71.1190,     // placeholder
        radiusM: 50        // radius in meters
      }
    ];

    // =============================
    // STATE
    // =============================
    var currentLensLabel = "Explore";   // current lens
    var currentContext   = null;        // { type: 'marker' | 'zone', id: string }
    var markerVisible    = false;
    var activeZoneId     = null;

    var userLat = null;
    var userLon = null;

    // =============================
    // LENS / AURA
    // =============================
    function setLens(lensLabel) {
      currentLensLabel = lensLabel;

      // Update aura
      var lensKey = lensLabel.toLowerCase();
      var aura = document.getElementById('lens-aura');
      aura.classList.remove(
        'lens-explore',
        'lens-serve',
        'lens-create',
        'lens-inspire',
        'lens-reflect'
      );
      aura.classList.add('lens-' + lensKey);

      // If the card is currently visible and we have a context, update content
      var cardEl = document.getElementById("card");
      if (cardEl.style.display !== "none" && currentContext) {
        updateCardForCurrentLens(false); // don't force show; just update content
      }
    }

    // =============================
    // CARD CONTENT
    // =============================
    function updateCardForCurrentLens(showIfHidden) {
      if (typeof showIfHidden === "undefined") {
        showIfHidden = true;
      }

      var titleEl = document.getElementById("card-title");
      var textEl  = document.getElementById("card-text");
      var linkEl  = document.getElementById("reflect-link");
      var cardEl  = document.getElementById("card");

      if (!currentContext) {
        if (showIfHidden) {
          cardEl.style.display = "none";
        }
        return;
      }

      var ctxId = currentContext.id;
      var placeContent = CONTENT[ctxId];
      var story = "";

      if (placeContent && placeContent[currentLensLabel]) {
        story = placeContent[currentLensLabel];
      } else {
        story = STORIES[currentLensLabel] || "";
      }

      titleEl.innerText = currentLensLabel;
      textEl.innerText  = story;

      // Build reflection link with lens + context
      var params = [];
      params.push("lens=" + encodeURIComponent(currentLensLabel));
      if (currentContext && currentContext.id) {
        params.push("context=" + encodeURIComponent(currentContext.id));
      }

      var urlHasQuery = FORM_URL_BASE.indexOf("?") !== -1;
      var link = urlHasQuery
        ? FORM_URL_BASE + "&" + params.join("&")
        : FORM_URL_BASE + "?" + params.join("&");

      linkEl.href = link;

      if (showIfHidden) {
        cardEl.style.display = "block";
      }
    }

    function hideCard() {
      document.getElementById("card").style.display = "none";
      // We keep currentContext so new triggers can re-use it if needed
    }

    // =============================
    // GEOLOCATION / ZONES
    // =============================
    function startGeoWatch() {
      if (!navigator.geolocation) {
        console.warn("Geolocation not available in this browser.");
        return;
      }

      navigator.geolocation.watchPosition(
        function (pos) {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          checkNearbyZones();
        },
        function (err) {
          console.warn("Geolocation error:", err);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 10000,
          timeout: 20000
        }
      );
    }

    function checkNearbyZones() {
      var i;
      var zone;
      var nearestZone = null;

      for (i = 0; i < ZONES.length; i++) {
        zone = ZONES[i];
        if (isInsideZone(userLat, userLon, zone)) {
          nearestZone = zone;
          break; // simple: first match wins
        }
      }

      if (nearestZone) {
        if (activeZoneId !== nearestZone.id) {
          activeZoneId = nearestZone.id;
          // Only switch context if marker is NOT visible
          if (!markerVisible) {
            currentContext = { type: 'zone', id: activeZoneId };
            updateCardForCurrentLens(true);
          }
        }
      } else {
        // Left all zones
        activeZoneId = null;
        if (!markerVisible) {
          currentContext = null;
          hideCard();
        }
      }
    }

    function isInsideZone(userLat, userLon, zone) {
      if (userLat == null || userLon == null) return false;

      var R = 6371e3; // Earth radius in meters
      var dLat = (zone.lat - userLat) * Math.PI / 180;
      var dLon = (zone.lon - userLon) * Math.PI / 180;

      var a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(userLat * Math.PI / 180) * Math.cos(zone.lat * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      var distance = R * c;

      return distance <= zone.radiusM;
    }

    // =============================
    // INIT: marker + geolocation
    // =============================
    window.addEventListener('DOMContentLoaded', function () {
      // Initialize aura to default lens
      setLens(currentLensLabel);

      // Marker-based triggers
      var marker = document.querySelector('#ww-marker');
      if (marker) {
        marker.addEventListener('markerFound', function () {
          markerVisible = true;
          currentContext = { type: 'marker', id: 'hiro_marker' };
          updateCardForCurrentLens(true);
        });

        marker.addEventListener('markerLost', function () {
          markerVisible = false;

          if (activeZoneId) {
            // Fall back to zone if we are inside one
            currentContext = { type: 'zone', id: activeZoneId };
            updateCardForCurrentLens(true);
          } else {
            currentContext = null;
            hideCard();
          }
        });
      }

      // Start GPS watching for zones
      startGeoWatch();
    });
  </script>
</body>
</html>
